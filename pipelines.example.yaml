# Pipelines for the Lineage Explorer backend.
# Copy this file, adjust the paths and start the API with:
#   PIPELINES_CONFIG=/path/to/pipelines.yaml uv run lineage-api
#
# One entry per pipeline = one dbt project, laid out as
#   models/01_source  ->  models/02_intermediate  ->  models/03_output
# with its own manifest.json + catalog.json (`dbt docs generate`).
#
# Keys per entry:
#   name      required; the pipeline's identity, shown in the UI. Unique; letters, digits,
#             _ and -. The dbt project_name is NOT used (all projects are called dbt_pnc);
#             node ids are scoped by this name: model.dbt_pnc.x -> model.<name>.x
#   dir       folder holding manifest.json and catalog.json
#   manifest  explicit path to manifest.json (instead of, or overriding, dir)
#   catalog   explicit path to catalog.json; optional (without it there are no column
#             types or row counts)
# Relative paths resolve against the folder of this file; ~ is expanded.
#
# Pipelines are connected by table name: when a pipeline declares another pipeline's output
# table as a dbt source, the two are linked. Output table names must be unique across all
# pipelines.

pipelines:
  # Short form: a folder with manifest.json + catalog.json inside.
  - name: bestand_mfp
    dir: artifacts/bestand_mfp
    execution_modes:
      - full_mode: 
          full_mode: true
          monthly_mode: false
      - incremental_mode:
          full_mode: false
          monthly_mode: true

  # Explicit paths, e.g. straight from a dbt project's target/ folder.
  - name: schaden_claims
    manifest: ~/projects/pnc/schaden_claims/target/manifest.json
    catalog: ~/projects/pnc/schaden_claims/target/catalog.json

  # No catalog: the graph and SQL still work, the Schema tab has no types.
  - name: finance_controlling
    manifest: /data/dbt/finance_controlling/manifest.json
